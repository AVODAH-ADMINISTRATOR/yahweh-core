# Phase 4: Training Configuration
# Step 93: Multi-node GPU cluster setup (DeepSpeed/Megatron-LM)
# Step 108: Hyperparameter tuning optimization

model:
  size: "base"                    # Options: debug | base | large | full
  src_vocab_size: 64000           # Step 92: Extended ancient language vocabulary
  tgt_vocab_size: 64000
  use_flash_attention: true       # Step 107: FlashAttention-2

training:
  # Core training hyperparameters (Step 108)
  num_epochs: 10
  learning_rate: 2.0e-5
  weight_decay: 0.1
  warmup_steps: 500
  per_gpu_batch_size: 4
  gradient_accumulation_steps: 8  # Effective batch = 4 * 8 * num_gpus (Step 102)
  max_src_len: 512
  max_tgt_len: 512
  num_workers: 4

  # Loss configuration (Step 99)
  keyword_penalty_weight: 3.0
  alignment_reg_weight: 0.1
  label_smoothing: 0.1

  # Step 110: Early stopping
  early_stopping_patience: 5

  # Step 112: Checkpointing
  keep_last_n_checkpoints: 3
  save_every_n_steps: 1000

  # Logging
  log_steps: 100

evaluation:
  # Step 117: Evaluation metrics (target COMET > 92.0)
  comet_model: "Unbabel/wmt22-comet-da"
  use_comet: true
  beam_size: 4
  eval_every_n_epochs: 1

distributed:
  # Step 93: Multi-node configuration for A100/H100 cluster
  backend: "nccl"
  num_nodes: 2
  num_gpus_per_node: 8

# Paths
paths:
  output_dir: "checkpoints/"
  log_dir: "logs/"
  registry_dir: "checkpoints/registry/"
