name: Biblical Translation Engine CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Council OS Charter Gate
      run: |
        echo "Binding charter policy at compile time..."
        pip install pytest
        python -m council_os.policy
        python -m pytest council_os/tests/ -q

    - name: Run Tests
      run: |
        echo "Running NLP Pipeline Tests..."
        pip install -r services/nlp-core/requirements.txt
        python -m pytest services/nlp-core/tests/
        echo "Running Textual Criticism Tests..."
        pip install -r services/textual-criticism/requirements.txt
        python -m pytest services/textual-criticism/tests/

    - name: Docker Compose Validation
      run: |
        docker-compose -f infrastructure/docker-compose.yml config -q

    - name: Security Scan (Placeholder)
      run: |
        echo "Running basic security scans on Dockerfiles and configs..."
