name: CI Pipeline

on:
  push:
    branches: [twin]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
      - name: Lint council_os
        run: flake8 council_os --count --statistics
      - name: Test council_os
        run: pytest council_os/tests --cov=council_os --cov-report=term-missing --cov-fail-under=90 --maxfail=1 -v
