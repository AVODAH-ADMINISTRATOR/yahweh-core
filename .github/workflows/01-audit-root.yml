name: Welcome - Audit Root
on:
  push:
    branches: [main, twin]
  workflow_dispatch:
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate project charter and tests
        run: |
          python yahweh_kernel.py
          python -m council_os.policy
          npx vitest run --reporter=dot
