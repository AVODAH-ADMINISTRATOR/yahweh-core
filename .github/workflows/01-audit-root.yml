name: Welcome - Audit Root
on:
  push:
    branches: [main, twin]
  workflow_dispatch:
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          echo "Welcome to yahweh-core"
          python yahweh_kernel.py
