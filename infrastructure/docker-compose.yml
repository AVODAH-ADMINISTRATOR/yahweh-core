      context: ../council_os
      dockerfile: Dockerfile
    environment:
      - HOME=/root
      - YAHWEH_CORE_HOME=/root/yahweh-core
      - COUNCIL_OS_DOMAIN=linguistic_nlp
      - COUNCIL_OS_PORT=8103
    ports:
      - "8103:8103"

  council-os-textual-criticism:
