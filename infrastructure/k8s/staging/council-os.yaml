# Eight Council OS domain service boundaries (staging).
# Independent health, logging, and rollback per domain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: council-os-identity
  namespace: staging
  labels:
    app: council-os
    domain: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      domain: identity
  template:
    metadata:
      labels:
        app: council-os
        domain: identity
    spec:
      containers:
      - name: identity
        image: your-registry/council-os:latest
        ports:
        - containerPort: 8101
        env:
        - name: COUNCIL_OS_DOMAIN
          value: "identity"
        - name: COUNCIL_OS_PORT
          value: "8101"
        readinessProbe:
          httpGet:
            path: /health
            port: 8101
---
apiVersion: v1
kind: Service
metadata:
  name: council-os-identity
  namespace: staging
spec:
  selector:
    domain: identity
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8101
  type: ClusterIP
---
